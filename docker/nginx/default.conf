server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php index.html;

    # Спецификация отдаётся как текст: браузер должен показать её,
    # а не предложить сохранить файл.
    location = /openapi.yaml {
        default_type text/yaml;
        charset utf-8;
    }

    # Единая точка входа. Каталог проверяется отдельно: без этого запрос
    # к странице документации уходил бы в маршрутизатор приложения.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;

        # Выше собственного таймаута обращения к поставщику
        fastcgi_read_timeout 60s;
    }
}
